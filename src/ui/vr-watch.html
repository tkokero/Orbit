<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><link rel="stylesheet" href="vr-watch.css"><title>Orbit watch</title></head><body><div class="strap top"></div><div class="strap bottom"></div><main class="watch-face"><header><span class="orbit-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><ellipse cx="16" cy="16" rx="15" ry="5" transform="rotate(-30 16 16)" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="25" cy="4" r="2" fill="currentColor"/></svg></span><strong id="clock">--:--</strong><span id="battery">—</span></header><section class="readings" aria-label="Performance"><div><strong id="fps">—</strong><small>FPS</small></div><div><strong id="gpu">—</strong><small>GPU ms</small></div></section><section class="media" aria-label="Music"><button data-action="previous" aria-label="Previous track" title="Previous track"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 7v18M24 7L11 16l13 9Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button><button data-action="play-pause" aria-label="Play or pause music" title="Play or pause music"><svg viewBox="0 0 36 32" aria-hidden="true"><path d="M4 6L18 16L4 26Z" fill="currentColor"/><path d="M25 7v18m6-18v18" stroke="currentColor" stroke-width="3.5"/></svg></button><button data-action="next" aria-label="Next track" title="Next track"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M24 7v18M8 7L21 16L8 25Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button></section><section class="quick"><button id="panels">Panels</button><button id="dashboard">Orbit</button><button id="pointer">Controls</button></section><div id="hint" role=
